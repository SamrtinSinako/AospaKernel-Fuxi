name: 构建 SukiSU 内核

on:
  workflow_dispatch:
    inputs:
      rekernel_branch:
        description: 'ReKernel-X分支'
        required: false
        default: main
        type: choice
        options:
          - upstream/main
          - upstream/v9.2
          - main
          - dev
      enable_susfs:
        description: '启用 SUSFS (开=inline hook, 关=syscall hook)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - SukiSU-Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg libssl-dev libelf-dev \
            cpio zip xz-utils wget python3

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchains/clang
          cd toolchains/clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: Setup SukiSU-Ultra
        run: |
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          KSU_VER=$(cd KernelSU && git describe --tags 2>/dev/null || git log --oneline -1 --format=%h 2>/dev/null)
          echo "KSU_VER=${KSU_VER}" >> $GITHUB_ENV

      - name: Setup Re:Kernel (with git for auto-update)
        run: |
          rm -rf Re-Kernel
          git clone --depth=1 -b ${{ inputs.rekernel_branch || 'main' }} https://github.com/myflavor/ReKernel-X.git Re-Kernel
          mkdir -p drivers/rekernel
          cp -f Re-Kernel/LKM-Source/rkx*.c drivers/rekernel/
          cp -f Re-Kernel/LKM-Source/rkx*.h drivers/rekernel/
          RKX_VER=$(cd Re-Kernel && git describe --tags 2>/dev/null || git log --oneline -1 --format=%h 2>/dev/null)
          echo "RKX_VER=${RKX_VER}" >> $GITHUB_ENV
          sed 's/obj-m/obj-$(CONFIG_REKERNEL)/' Re-Kernel/LKM-Source/Makefile > drivers/rekernel/Makefile
          # 去掉 ReKernel-X 上游 Makefile 里非法的 -mcpu=armv9-a (armv9-a 是架构名, -mcpu 只认具体核名, Neutron Clang 会拒绝)
          sed -i 's/-mcpu=armv9-a//g' drivers/rekernel/Makefile
          echo "ccflags-y += -DRKX_VERSION=\\\"r${RKX_VER}\\\"" >> drivers/rekernel/Makefile

      - name: Setup SUSFS (optional)
        if: inputs.enable_susfs
        run: |
          git clone --depth=1 -b gki-android13-5.15 https://github.com/ShirkNeko/susfs4ksu.git susfs4ksu
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git SukiSU_patch
          # 注: SukiSU-Ultra builtin 分支已内置 CONFIG_KSU_SUSFS 与 inline hook,
          # 无需打 10_enable_susfs_for_ksu.patch (那是 main 分支模块化结构专用)
          # 1) 拷 susfs 源码到内核树
          cp susfs4ksu/kernel_patches/fs/* ./fs/
          cp susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          # 2) 打内核树 susfs 主补丁
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch ./
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch || patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android13-5.15.patch
          # 3) 打隐藏补丁 (官方配套)
          cp SukiSU_patch/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch || true
          # 4) 追加 SUSFS defconfig
          {
            echo 'CONFIG_KSU_SUSFS=y'
            echo 'CONFIG_KSU_SUSFS_SUS_PATH=y'
            echo 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
            echo 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
            echo 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
            echo 'CONFIG_KSU_SUSFS_ENABLE_LOG=y'
            echo 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
            echo 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
            echo 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
            echo 'CONFIG_KSU_SUSFS_SUS_MAP=y'
          } >> arch/arm64/configs/fuxi_defconfig
          SUSFS_VERSION=$(grep -E "^#define SUSFS_VERSION" susfs4ksu/kernel_patches/include/linux/susfs.h | cut -d' ' -f3 | tr -d '"')
          echo "SUSFS_VERSION=${SUSFS_VERSION}" >> $GITHUB_ENV

      - name: Disable SUSFS (syscall hook mode)
        if: ${{ !inputs.enable_susfs }}
        run: |
          # builtin 分支 CONFIG_KSU_SUSFS 默认 y, 未集成 susfs 源码时必须显式关闭,
          # 否则 olddefconfig 会开启 SUSFS 并编译不存在的 fs/susfs.c 导致失败
          echo '# CONFIG_KSU_SUSFS is not set' >> arch/arm64/configs/fuxi_defconfig

      - name: Prepare ccache
        run: mkdir -p ~/.ccache

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref_name }}
          restore-keys: ccache-

      - name: Set build info
        run: |
          echo "BUILD_NUM=${{ github.run_number }}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          if [ "${{ inputs.enable_susfs }}" == "true" ]; then
            echo "HOOK_TYPE=inline hook" >> $GITHUB_ENV
          else
            echo "HOOK_TYPE=syscall hook" >> $GITHUB_ENV
          fi

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchains/clang/bin:/usr/lib/ccache:$PATH"
          export CCACHE_DIR=~/.ccache
          ccache -M 8G
          make LLVM=1 LLVM_IAS=1 O=out LOCALVERSION=-AOSPA-BY@Samrtin fuxi_defconfig -j$(nproc --all)
          make LLVM=1 LLVM_IAS=1 O=out Image -j$(nproc --all) 2>&1 | tee out/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi

      - name: Package flashable zip
        run: |
          if [ -d tools/AK3 ] && [ -f out/arch/arm64/boot/Image ]; then
            rm -rf out/AK3
            cp -r tools/AK3 out/
            cp out/arch/arm64/boot/Image out/AK3/Image
            cd out/AK3
            ZIPNAME="Fuxi-SukiSU-$(date -u '+%Y%m%d-%H%M').zip"
            zip -r9 "$ZIPNAME" .
            mv "$ZIPNAME" ../../
            echo "Zip created"
          else
            echo "Image not found"
            exit 1
          fi

      - name: Upload to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          ZIP_FILE=$(ls Fuxi-SukiSU-*.zip 2>/dev/null | head -1)
          if [ -n "$ZIP_FILE" ] && [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            NL=$'\n'
            SUSFS_LINE=""
            if [ "${{ inputs.enable_susfs }}" == "true" ]; then
              SUSFS_LINE="${NL}✅ SUSFS ${SUSFS_VERSION:-v1.5.x}"
            fi
            CAPTION="✅ SukiSU 内核编译完成${NL}✅ SukiSU-Ultra: ${KSU_VER}${NL}✅ Hook: ${HOOK_TYPE}${NL}✅ ReKernel-X: ${RKX_VER}${NL}✅ BBR：V1${NL}✅ Lz4：1.10${SUSFS_LINE}${NL}构建号: SukiSU-${{ github.run_number }}"
            curl -s -F chat_id="$CHAT_ID" \
              -F document=@"$ZIP_FILE" \
              -F "caption=$CAPTION" \
              "https://api.telegram.org/bot${TOKEN}/sendDocument"
          else
            echo "Telegram upload skipped (missing token/chat_id or zip)"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AospaFuxi-SukiSU-Kernel
          path: "Fuxi-SukiSU-*.zip"
          if-no-files-found: warn

      - name: Create Release
        if: success()
        run: |
          GH_TOKEN=${{ github.token }} gh release create SukiSU-Build-${{ github.run_number }} Fuxi-SukiSU-*.zip \
            --repo ${{ github.repository }} \
            --title "SukiSU 内核 #${{ github.run_number }}" \
            --generate-notes
