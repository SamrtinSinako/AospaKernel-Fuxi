name: 构建 FolkPatch 内核

on:
  workflow_dispatch:
  push:
    branches:
      - FolkPatch-Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg libssl-dev libelf-dev \
            cpio zip xz-utils wget python3 unzip

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchains/clang
          cd toolchains/clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: Setup Re:Kernel (with git for auto-update)
        run: |
          rm -rf Re-Kernel
          git clone --depth=1 https://github.com/myflavor/ReKernel-X.git Re-Kernel
          mkdir -p drivers/rekernel
          cp -f Re-Kernel/LKM-Source/rekernel*.c drivers/rekernel/
          cp -f Re-Kernel/LKM-Source/rekernel*.h drivers/rekernel/
          # 生成适配内置编译的Makefile(多文件结构)
          echo 'obj-$(CONFIG_REKERNEL) += rekernel.o' > drivers/rekernel/Makefile
          echo 'rekernel-y := rekernel_x_main.o rekernel_x_genl.o rekernel_x_netuid.o rekernel_x_frozen.o rekernel_x_binder.o rekernel_x_signal.o rekernel_x_netfilter.o rekernel_x_binder_kp.o' >> drivers/rekernel/Makefile

      - name: Prepare ccache
        run: mkdir -p ~/.ccache

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-fp-${{ github.ref_name }}
          restore-keys: ccache-fp-

      - name: Build kernel with FolkPatch
        run: |
          export PATH="$(pwd)/toolchains/clang/bin:/usr/lib/ccache:$PATH"
          export CCACHE_DIR=~/.ccache
          ccache -M 8G
          # 首次运行: 初始克隆KernelSU和ReKernel
          if [ ! -d KernelSU/.git ]; then
            rm -rf KernelSU
            git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
            rm -f drivers/kernelsu
            ln -sf ../KernelSU/kernel drivers/kernelsu
          fi
          if [ ! -d Re-Kernel/.git ]; then
            rm -rf Re-Kernel
            git clone --depth=1 -b ${{ inputs.rekernel_branch || 'main' }} https://github.com/myflavor/ReKernel-X.git Re-Kernel
          fi
          bash build.sh
          cp ~/Fuxi-FolkPatch-*.zip ./ 2>/dev/null || true

      - name: Set build info
        run: |
          echo "BUILD_NUM=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Upload to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          ZIP_FILE=$(ls Fuxi-FolkPatch-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 ZIP 文件，跳过上传"
            exit 0
          fi
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            NL=$'\n'
            FP_VER=$(curl -sL 'https://raw.githubusercontent.com/LyraVoid/FolkPatch/main/build.gradle.kts' 2>/dev/null | grep -o 'return [0-9]*' | grep -o '[0-9]*' || echo '114265')
            RK_VER=$(cd Re-Kernel && git describe --tags 2>/dev/null || git log --oneline -1 --format=%h 2>/dev/null)
            CAPTION="✅ FolkPatch 内核编译完成${NL}✅ FolkPatch：${FP_VER}${NL}✅ Hook: KernelPatch${NL}✅ ReKernel-X: ${RK_VER}${NL}✅ BBR：5.15${NL}✅ LZ4：1.10${NL}构建号: FolkPatch-${{ github.run_number }}"
            curl -s -F chat_id="$CHAT_ID" \
              -F document=@"$ZIP_FILE" \
              -F "caption=$CAPTION" \
              "https://api.telegram.org/bot${TOKEN}/sendDocument"
          else
            echo "Telegram upload skipped (missing token/chat_id)"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FolkPatch-Kernel
          path: "Fuxi-FolkPatch-*.zip"
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/FolkPatch-Build'
        run: |
          GH_TOKEN=${{ github.token }} gh release create FolkPatch-Build-${{ github.run_number }} Fuxi-FolkPatch-*.zip \
            --repo ${{ github.repository }} \
            --title "FolkPatch 内核 #${{ github.run_number }}" \
            --generate-notes